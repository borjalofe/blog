name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  content:
    runs-on: docker
    container:
      image: docker.io/library/node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Validate Obsidian-flavored Markdown
        run: npm run validate:ofm
      - name: Validate layout and frontmatter
        run: npm run validate:contract
